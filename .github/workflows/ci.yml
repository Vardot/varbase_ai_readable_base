# Continuous integration for the Varbase AI Readable Base recipe.
#
# The repository is private, so this runs on GitHub Actions rather than the
# drupal.org GitLab templates the public Varbase recipes use. Two jobs:
#
#   lint    composer.json, every YAML file, and no PHP file in the repository.
#   recipe  a real Varbase 11 site, built as Vardot's public recipe CI builds
#           one (drupal/varbase_project 11.0.x-dev, installed from Varbase
#           Starter). Require this checkout, apply the recipe twice (it must be
#           safe to re-apply), check it with drush, then serve the site over
#           real HTTP: fast_404 must block /llms.txt until the settings.php line
#           from the README is added, and then /llms.txt and the Markdown of a
#           node must answer 200 text/markdown. Then the functional suite in
#           tests/features (Playwright + Cucumber through @vardot/varbase-e2e)
#           runs in Chromium.

name: CI

on:
  push:
    branches: ['1.0.x']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  DRUPAL_CORE: '~11.4.0'
  RECIPE: varbase_ai_readable_base
  PACKAGE: vardot/varbase_ai_readable_base
  COMPOSER_NO_INTERACTION: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint YAML
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(set(glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True) + glob.glob('.github/**/*.yml', recursive=True)))
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f, encoding='utf-8')))
              except Exception as e:
                  print(f'::error file={f}::{e}')
                  bad += 1
          print(f'{len(files)} YAML files checked, {bad} with errors')
          sys.exit(1 if bad else 0)
          PY

      - name: No PHP in the recipe
        run: |
          # A recipe ships config only: no .php, .module, .install or .inc file.
          found=$(find . -path ./.git -prune -o -path ./vendor -prune -o -path ./node_modules -prune -o -type f \( -name '*.php' -o -name '*.module' -o -name '*.install' -o -name '*.inc' \) -print)
          if [ -n "$found" ]; then echo "::error::PHP files found: $found"; exit 1; fi
          echo 'No PHP files.'

  recipe:
    name: Apply on a Varbase 11 site (Varbase Starter)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A throw-away test site. Composer 2.9 refuses packages with open security
      # advisories, and since 8 October 2026 every enshrined/svg-sanitize release,
      # which Varbase Media Base needs through svg_image, has one. Production
      # sites decide on advisories themselves; this site only has to build.
      COMPOSER_NO_SECURITY_BLOCKING: '1'
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: drupal
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          path: recipe

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, pdo_mysql, mysqli, mbstring, intl, zip, bcmath, opcache, pcntl
          # As a served site runs: assertions off (Vardot's recipe CI does the
          # same, for an upstream SDC prop mismatch in media rendering).
          ini-values: memory_limit=-1, zend.assertions=-1
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-varbase-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('recipe/composer.json') }}
          restore-keys: composer-varbase-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Build a Varbase 11 site that requires this checkout
        run: |
          # The Varbase project template, as Vardot's public recipe CI uses it,
          # with Varbase's curated patches. Retried: drupal.org clones can reset.
          for i in 1 2 3; do
            composer create-project drupal/varbase_project:11.0.x-dev site --no-install --no-interaction --no-scripts --ignore-platform-req=ext-pgsql && break
            echo "create-project attempt $i failed, retrying"; rm -rf site; sleep 20
          done
          cd site
          # Temporary pin. vardot/varbase-patches 11.0.48 (8 October 2026) re-rolled
          # the tagify #3555084 patch (MR 270) against a base no tagify release
          # matches, so composer-patches, which uses git apply, cannot apply it
          # to tagify 1.2.53, 1.2.54 or 1.2.55. 11.0.47's patch (MR 177) applies
          # to tagify up to 1.2.54. Drop both pins once the patch is re-rolled.
          composer require --no-update vardot/varbase-patches:11.0.47 drupal/tagify:1.2.54
          composer config minimum-stability dev
          composer config repositories.recipe "{\"type\": \"path\", \"url\": \"../recipe\", \"options\": {\"symlink\": false, \"versions\": {\"${PACKAGE}\": \"1.0.x-dev\"}}}"
          composer config --json extra.drupal-recipe-unpack.ignore "[\"${PACKAGE}\"]"
          # Twig stays below 3.30, which
          # breaks the cva module Varbase uses (as Vardot's recipe CI pins it).
          for i in 1 2 3; do
            composer require "${PACKAGE}:1.0.x-dev" "twig/twig:<3.30" -W --no-interaction --ignore-platform-req=ext-pgsql && break
            echo "require attempt $i failed, retrying"; sleep 15
          done
          test -d web/core
          composer show --no-ansi | grep -E 'drupal/(core|llms_txt|markdownify|fast_404|cva|canvas|varbase_starter|vartheme_bs5) |vardot/|twig/twig |drupal/tagify '

      - name: Patch core 2741429, as Vardot's recipe CI does
        working-directory: site
        run: |
          # A guard for a NULL view mode in EntityDisplayBase that a Varbase
          # install can hit before vardot/varbase-patches is active.
          curl -fsSL -o /tmp/2741429.patch "https://raw.githubusercontent.com/Vardot/drupal-core-patches/refs/heads/patches/drupal-core--2026-07-02--2741429--entitydisplaybase-null-mode-entity.patch"
          if patch -p1 -d web --forward --dry-run < /tmp/2741429.patch; then
            patch -p1 -d web --forward < /tmp/2741429.patch
          else
            echo "core 2741429 already applied"
          fi

      - name: Install Varbase Starter
        working-directory: site
        run: |
          bin/drush site:install "$PWD/recipes/varbase_starter" --db-url=mysql://root:root@127.0.0.1:3306/drupal \
            --account-name=admin --account-pass=admin --site-name="Recipe CI" --locale=en -y
          bin/drush cr
          # The newest log entry before the recipe: "no new errors" is checked from here.
          bin/drush php:eval 'echo (int) (\Drupal::database()->schema()->tableExists("watchdog") ? \Drupal::database()->query("SELECT MAX(wid) FROM {watchdog}")->fetchField() : 0);' > /tmp/wid-before
          echo "watchdog wid before the recipe: $(cat /tmp/wid-before)"

      - name: Apply the recipe
        working-directory: site
        run: |
          bin/drush recipe "$PWD/recipes/${RECIPE}"
          bin/drush cr

      - name: Apply the recipe again
        working-directory: site
        run: |
          # The second apply must change nothing: compare a full config export.
          bin/drush config:export --destination=/tmp/config-1 -y
          bin/drush recipe "$PWD/recipes/${RECIPE}"
          bin/drush config:export --destination=/tmp/config-2 -y
          diff -r /tmp/config-1 /tmp/config-2
          echo 'The second apply changed no config.'

      - name: Check the recipe without an AI key
        working-directory: site
        run: |
          # The checks run inline: the recipe ships no PHP file. Each prints PASS or FAIL,
          # then RESULT, and a failure throws so that drush exits non-zero.
          bin/drush php:eval "$(cat <<'PHP'
          $failed = FALSE;
          $check = function (string $label, bool $ok, string $detail = '') use (&$failed): void {
            if (!$ok) {
              $failed = TRUE;
            }
            echo sprintf("%-4s %s%s\n", $ok ? 'PASS' : 'FAIL', $label, $detail !== '' ? " ($detail)" : '');
          };

          $module_handler = \Drupal::moduleHandler();
          foreach (['llms_txt', 'markdownify', 'markdownify_path', 'markdownify_file_attachment'] as $module) {
            $check("module $module enabled", $module_handler->moduleExists($module));
          }
          // markdownify_views 1.2.0 answers 500 for every View on core 11.4
          // (https://www.drupal.org/i/3590402): the recipe must not install it.
          $check('module markdownify_views not enabled', !$module_handler->moduleExists('markdownify_views'));
          echo 'INFO fast404 ' . ($module_handler->moduleExists('fast404') ? 'enabled: the settings.php line is needed' : 'not enabled') . "\n";

          $expected = "# [site:name]\n\n[site:slogan]\n\n## Main navigation\n\n[llms_txt_markdown_menu:main]\n\n## Footer\n\n[llms_txt_markdown_menu:footer]\n";
          $check('llms_txt.settings content is the recipe template', \Drupal::config('llms_txt.settings')->get('content') === $expected);

          foreach (['main', 'footer'] as $menu) {
            $check("menu $menu exists", \Drupal\system\Entity\Menu::load($menu) !== NULL);
          }

          $grants = [
            'seo_admin' => ['administer llms.txt configuration', 'administer llms.txt sections'],
            'site_admin' => ['administer llms.txt configuration', 'administer llms.txt sections', 'administer markdownify'],
          ];
          foreach ($grants as $rid => $permissions) {
            $role = \Drupal\user\Entity\Role::load($rid);
            $has = $role ? array_filter($permissions, fn($p) => $role->hasPermission($p)) : [];
            $check("$rid has the llms.txt permissions", $role !== NULL && count($has) === count($permissions),
              $role ? count($has) . ' of ' . count($permissions) : 'role missing');
          }
          $editor = \Drupal\user\Entity\Role::load('content_editor');
          $check('content_editor cannot change llms.txt', $editor === NULL || !$editor->hasPermission('administer llms.txt configuration'));

          echo $failed ? "RESULT: FAIL\n" : "RESULT: PASS\n";
          if ($failed) {
            throw new \RuntimeException('One or more checks failed.');
          }
          PHP
          )"

      - name: Add a page in the main menu, to check its Markdown
        working-directory: site
        run: |
          bin/drush php:eval "$(cat <<'PHP'
          $values = [
            'type' => 'page',
            'title' => 'About llms.txt',
            'status' => 1,
            'path' => ['alias' => '/about-llmstxt', 'pathauto' => 0],
          ];
          $node = \Drupal\node\Entity\Node::create($values);
          foreach (['field_content', 'body'] as $field) {
            if ($node->hasField($field)) {
              $node->set($field, ['value' => '<h2>Why</h2><p>This page checks <strong>Markdown</strong> output for AI tools.</p>', 'format' => 'full_html']);
              break;
            }
          }
          if ($node->hasField('moderation_state')) {
            $node->set('moderation_state', 'published');
          }
          $node->save();
          \Drupal\menu_link_content\Entity\MenuLinkContent::create([
            'title' => 'About llms.txt',
            'link' => ['uri' => 'entity:node/' . $node->id()],
            'menu_name' => 'main',
            'weight' => 50,
          ])->save();
          echo $node->id();
          PHP
          )" > /tmp/test-nid
          echo "Test page: node $(cat /tmp/test-nid), /about-llmstxt"
          bin/drush cr

      - name: Serve the site
        working-directory: site
        run: |
          # The Webmaster in cucumber.shared.js is uid 1.
          bin/drush php:eval '$u = \Drupal\user\Entity\User::load(1); $u->setUsername("webmaster"); $u->setEmail("webmaster@example.test"); $u->setPassword("dD.123123ddd"); $u->save();'
          # Headless test prep, as Vardot's recipe CI does on Varbase sites.
          bin/drush pm:uninstall antibot big_pipe seckit -y || true
          bin/drush config:set system.performance css.preprocess 0 -y
          bin/drush config:set system.performance js.preprocess 0 -y
          bin/drush cr
          # Drupal expects the docroot as the working directory: from anywhere else
          # plugin discovery finds nothing and every page is a 500.
          (cd web && PHP_CLI_SERVER_WORKERS=8 nohup php -S 127.0.0.1:8080 .ht.router.php > /tmp/php-server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/user/login && break; sleep 2; done
          curl -s -o /dev/null -w 'user/login: HTTP %{http_code}\n' http://127.0.0.1:8080/user/login

      - name: Without the settings.php line, fast_404 blocks /llms.txt
        working-directory: site
        run: |
          # What a site gets when the README step is skipped. Informational: it
          # documents the trap, and stops being true only if Varbase drops fast_404.
          for i in 1 2; do
            curl -s -o /dev/null -w "INFO /llms.txt before the settings.php line, request $i: HTTP %{http_code}, X-Drupal-Cache: %header{x-drupal-cache}\n" http://127.0.0.1:8080/llms.txt
          done

      - name: Add the fast_404 settings.php line from the README
        working-directory: site
        run: |
          chmod u+w web/sites/default web/sites/default/settings.php
          cat >> web/sites/default/settings.php <<'SETTINGS'

          // Varbase AI Readable Base: let /llms.txt reach Drupal. fast_404's default
          // pattern with /llms.txt exempted; every other .txt path still fast-404s.
          $settings['fast404_exts'] = '/^(?!\/robots)^(?!\/llms\.txt$)^(?!\/system\/files).*\.(txt|png|gif|jpe?g|css|js|ico|swf|flv|cgi|bat|pl|dll|exe|asp)$/i';
          SETTINGS
          tail -4 web/sites/default/settings.php
          # OPcache rechecks a changed file at most every 2 seconds
          # (opcache.revalidate_freq), so a request straight after the edit can
          # still run the old settings.php and get the 404. fast_404's 404 is not
          # page-cached (X-Drupal-Cache: UNCACHEABLE), so no cache clear is needed.
          sleep 3
          curl -s -o /dev/null -w "INFO /llms.txt after the line: HTTP %{http_code}, X-Drupal-Cache: %header{x-drupal-cache}\n" http://127.0.0.1:8080/llms.txt

      - name: Check llms.txt and Markdown over real HTTP
        working-directory: site
        run: |
          base=http://127.0.0.1:8080
          nid=$(cat /tmp/test-nid)
          fail=0
          expect() {
            # expect <label> <status> <content-type prefix> <curl args...>
            label=$1 want_code=$2 want_type=$3; shift 3
            got=$(curl -s -o /tmp/body -w '%{http_code} %{content_type}' "$@")
            code=${got%% *} type=${got#* }
            if [ "$code" = "$want_code" ] && [[ "$type" == "$want_type"* ]]; then
              echo "PASS $label -> $got"
            else
              echo "FAIL $label -> $got (want $want_code $want_type)"; fail=1
            fi
          }
          expect '/llms.txt' 200 'text/markdown' "$base/llms.txt"
          grep -q '^## Main navigation' /tmp/body && grep -q 'About llms.txt' /tmp/body && grep -q '^## Footer' /tmp/body \
            && echo 'PASS /llms.txt lists the main and footer menus' || { echo 'FAIL /llms.txt does not list the menus'; cat /tmp/body; fail=1; }
          expect "/node/$nid.md" 200 'text/markdown' "$base/node/$nid.md"
          grep -q 'Markdown' /tmp/body && echo 'PASS the node Markdown holds the page text' || { echo 'FAIL the node Markdown is empty'; fail=1; }
          expect '/about-llmstxt (Accept: text/markdown)' 200 'text/markdown' -H 'Accept: text/markdown' "$base/about-llmstxt"
          expect '/about-llmstxt' 200 'text/html' "$base/about-llmstxt"
          expect '/nothing.txt' 404 '' "$base/nothing.txt"
          expect '/robots.txt' 200 'text/plain' "$base/robots.txt"
          cmp -s /tmp/body web/robots.txt && echo 'PASS /robots.txt is the file on disk' || { echo 'FAIL /robots.txt changed'; fail=1; }
          echo '--- /llms.txt'
          curl -s "$base/llms.txt"
          if [ "$fail" != 0 ]; then echo '::error::llms.txt or Markdown output is wrong over HTTP'; exit 1; fi

      - name: No new errors in the log
        working-directory: site
        run: |
          bin/drush php:eval "$(cat <<'PHP'
          $db = \Drupal::database();
          if (!$db->schema()->tableExists('watchdog')) {
            echo "INFO dblog is not enabled: no log to read\n";
            return;
          }
          $since = (int) file_get_contents('/tmp/wid-before');
          $all = $db->query('SELECT wid, type, message, variables FROM {watchdog} WHERE wid > :w AND severity <= 3', [':w' => $since])->fetchAll();
          // The runner has no mail transport, so a mail Drupal sends (the uid 1
          // rename, a moderation notice) fails here and nowhere else. Shown, not failed.
          $mail_types = ['symfony_mailer_lite', 'symfony_mailer', 'mail', 'mailsystem'];
          $rows = [];
          foreach ($all as $row) {
            $vars = @unserialize($row->variables, ['allowed_classes' => FALSE]);
            // Objects (markup, backtraces) arrive as incomplete classes: keep scalars only.
            $vars = is_array($vars) ? array_map(fn($v) => is_scalar($v) ? (string) $v : '', $vars) : [];
            $text = str_replace("\n", ' ', strip_tags(strtr($row->message, $vars)));
            if (in_array($row->type, $mail_types, TRUE)) {
              echo "INFO watchdog {$row->wid} {$row->type} (no mail server in CI): " . substr($text, 0, 300) . "\n";
              continue;
            }
            echo "FAIL watchdog {$row->wid} {$row->type}: $text\n";
            $rows[] = $row;
          }
          if ($rows) {
            throw new \RuntimeException(count($rows) . ' new error(s) in the log.');
          }
          echo "PASS no new errors in the log since wid $since\n";
          PHP
          )"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the functional tests (Playwright + Cucumber)
        working-directory: recipe
        env:
          LAUNCH_URL: http://127.0.0.1:8080
        run: |
          echo "nodeLinker: node-modules" > .yarnrc.yml
          corepack enable
          # varbase-e2e's postinstall can rewrite cucumber.js; keep ours.
          cp cucumber.js /tmp/cucumber.js.bak
          yarn install
          cp /tmp/cucumber.js.bak cucumber.js
          ./node_modules/.bin/playwright install --with-deps chromium
          yarn test

      - name: Keep the test reports and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-tests
          path: |
            recipe/tests/reports/
            recipe/tests/screenshots/
            /tmp/php-server.log
          if-no-files-found: ignore
